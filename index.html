<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CA_0017_X_A_DT</title>

  <script type="module"
    src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js">
  </script>

  <style>
    body{
      margin:0;
      font-family:system-ui;
      background:#f4f4f5;
      color:#171717;
    }

    .app{
      max-width:1100px;
      margin:auto;
      padding:16px;
    }

    .head{
      display:flex;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .title{
      font-size:22px;
      font-weight:800;
    }

    .sub{
      color:#666;
      margin-top:4px;
    }

    .badge{
      padding:7px 10px;
      border-radius:999px;
      background:#fff3cd;
      border:1px solid #ead58a;
      font-size:12px;
      font-weight:800;
    }

    .card{
      background:white;
      border:1px solid #ddd;
      border-radius:18px;
      overflow:hidden;
      margin-top:14px;
    }

    .viewer{
      height:min(68vh,700px);
      min-height:420px;

      /* tmavšie CNC pozadie */
      background:
        radial-gradient(circle at 50% 35%, #666 0%, #343434 48%, #181818 100%);
    }

    model-viewer{
      width:100%;
      height:100%;

      /* mierne zvýšenie kontrastu */
      filter:contrast(1.12);
    }

    .toolbar{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      padding:12px;
      border-top:1px solid #e5e5e5;
    }

    .toolbar button,
    .arbtn{
      border:1px solid #ccc;
      background:white;
      padding:11px 14px;
      border-radius:10px;
      font-weight:700;
      min-height:44px;
    }

    .toolbar button:active{
      background:#e7e7e7;
    }

    .arbtn{
      background:#111;
      color:white;
      border-color:#111;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
      padding:14px;
    }

    .info{
      background:#f8f8f8;
      border-radius:12px;
      padding:12px;
    }

    .k{
      font-size:11px;
      color:#777;
      text-transform:uppercase;
    }

    .v{
      font-weight:750;
      margin-top:4px;
    }

    .note{
      padding:0 14px 16px;
      color:#555;
      font-size:13px;
    }

    @media(max-width:650px){
      .grid{
        grid-template-columns:repeat(2,1fr);
      }

      .viewer{
        min-height:390px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="head">
    <div>
      <div class="title">CA_0017_X_A_DT</div>
      <div class="sub">
        CNC operátorský 3D prototyp · DOOSAN DVF6500
      </div>
    </div>

    <div class="badge">PROTOTYPE</div>
  </div>

  <section class="card">

    <div class="viewer">

      <model-viewer
        id="mv"
        src="CA_0017_X_A_DT.glb"
        alt="3D model dielca"

        camera-controls
        touch-action="pan-y"

        shadow-intensity="1.4"
        shadow-softness="0.7"

        exposure="0.75"

        environment-image="neutral"

        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="fixed"

        camera-orbit="45deg 65deg auto"
        field-of-view="30deg">

        <button
          slot="ar-button"
          class="arbtn"
          style="position:absolute;right:12px;bottom:12px">
          ZOBRAZIŤ V AR
        </button>

      </model-viewer>

    </div>

    <div class="toolbar">
      <button data-view="iso">ISO</button>
      <button data-view="front">FRONT</button>
      <button data-view="top">TOP</button>
      <button data-view="right">RIGHT</button>
      <button data-view="reset">RESET</button>
    </div>

    <div class="grid">

      <div class="info">
        <div class="k">Revízia</div>
        <div class="v">A</div>
      </div>

      <div class="info">
        <div class="k">Operácia</div>
        <div class="v">DEMO</div>
      </div>

      <div class="info">
        <div class="k">Rozmery</div>
        <div class="v">243.11 × 204.92 × 64.00 mm</div>
      </div>

      <div class="info">
        <div class="k">Stav</div>
        <div class="v">Prototyp</div>
      </div>

    </div>

    <div class="note">
      AR v tejto verzii umiestni model do priestoru.
      Presné prekrytie na upnutý diel bude ďalšia fáza s referenčným markerom.
    </div>

  </section>
</div>

<script>
  const mv = document.getElementById('mv');

  const views = {
    iso:   '45deg 65deg auto',
    front: '0deg 90deg auto',
    top:   '0deg 0deg auto',
    right: '90deg 90deg auto',
    reset: '45deg 65deg auto'
  };

  document.querySelectorAll('[data-view]').forEach(button => {

    button.addEventListener('click', () => {

      mv.cameraOrbit = views[button.dataset.view];
      mv.fieldOfView = '30deg';
      mv.jumpCameraToGoal();

    });

  });
</script>

</body>
</html>
