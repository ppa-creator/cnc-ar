<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>CA_0017_X_A_DT - Marker AR v0.8</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html,body{
      margin:0;width:100%;height:100%;overflow:hidden;background:#000;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
    }

    .hud{
      position:fixed;left:10px;right:10px;top:10px;z-index:30;
      display:flex;justify-content:space-between;align-items:flex-start;
      gap:8px;pointer-events:none
    }

    .panel{
      background:rgba(10,10,10,.78);color:#fff;padding:10px 12px;
      border-radius:12px;max-width:min(470px,78vw);
      box-shadow:0 2px 12px rgba(0,0,0,.22)
    }

    .title{font-weight:850;font-size:14px}
    .sub{font-size:11px;opacity:.85;margin-top:4px;line-height:1.4}

    .states{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
    .state{
      padding:4px 7px;border-radius:999px;background:#553f09;
      color:#fff3be;font-size:10px;font-weight:850
    }
    .state.ok{background:#145c32;color:#d9ffe7}
    .state.err{background:#7b2020;color:#ffe0e0}

    .back{
      pointer-events:auto;border:0;border-radius:10px;background:rgba(255,255,255,.94);
      color:#111;font-weight:800;padding:9px 10px;text-decoration:none;
      min-height:40px;display:flex;align-items:center;font-size:12px
    }

    .hint{
      position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
      z-index:30;background:rgba(10,10,10,.76);color:#fff;padding:9px 12px;
      border-radius:999px;font-size:12px;text-align:center;
      max-width:calc(100vw - 24px);pointer-events:none
    }

    #startup{
      position:fixed;inset:0;z-index:25;background:#111;color:#fff;
      display:flex;flex-direction:column;justify-content:center;align-items:center;
      gap:10px;text-align:center;padding:20px
    }
    #startup.hidden{display:none}
    #startup small{opacity:.7;max-width:320px;line-height:1.45}

    #arjs-video,
    video{
      position:fixed!important;
      inset:0!important;
      width:100%!important;
      height:100%!important;
      object-fit:cover!important;
      z-index:-2!important;
      background:#000!important;
    }

    canvas.a-canvas{
      position:fixed!important;
      inset:0!important;
      z-index:0!important;
      background:transparent!important;
    }

    a-scene{
      position:fixed!important;
      inset:0!important;
      z-index:1!important;
      background:transparent!important;
    }

    .adjust{
      position:fixed;
      left:10px;
      right:10px;
      bottom:64px;
      z-index:35;
      display:flex;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
      pointer-events:auto;
    }

    .adjust button{
      min-height:42px;
      border:0;
      border-radius:10px;
      padding:9px 12px;
      background:rgba(255,255,255,.94);
      color:#111;
      font-weight:800;
      font-size:12px;
      box-shadow:0 2px 10px rgba(0,0,0,.18);
    }

    .adjust .readout{
      display:flex;
      align-items:center;
      padding:8px 11px;
      border-radius:10px;
      background:rgba(10,10,10,.78);
      color:#fff;
      font-size:11px;
      font-weight:750;
    }
  </style>

  <script>
    AFRAME.registerComponent('cnc-cad-style', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const root = this.el.getObject3D('mesh');
          if (!root) return;

          root.traverse((node) => {
            if (!node.isMesh || !node.geometry) return;

            node.material = new THREE.MeshStandardMaterial({
              color: 0xb9bdc2,
              roughness: 0.58,
              metalness: 0.10,
              side: THREE.DoubleSide
            });

            const eg = new THREE.EdgesGeometry(node.geometry, 25);
            const em = new THREE.LineBasicMaterial({
              color: 0x303438,
              transparent: true,
              opacity: 0.95
            });
            const lines = new THREE.LineSegments(eg, em);
            lines.renderOrder = 4;
            node.add(lines);
          });

          root.updateMatrixWorld(true);
          const box = new THREE.Box3().setFromObject(root);
          const center = new THREE.Vector3();
          box.getCenter(center);

          // CAD je v mm. Centrovanie X/Y, spodná Z na marker.
          this.el.object3D.position.set(-center.x, -center.y, -box.min.z);

          setState('modelState', 'MODEL ✓', true);
        });

        this.el.addEventListener('model-error', () => {
          setState('modelState', 'MODEL CHYBA', false, true);
        });
      }
    });

    function setState(id, text, ok=false, err=false) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = text;
      el.classList.toggle('ok', ok);
      el.classList.toggle('err', err);
    }

    function hideStartup() {
      const startup = document.getElementById('startup');
      if (startup) startup.classList.add('hidden');
    }

    function checkCameraVideo() {
      const video = document.querySelector('video');
      if (video && video.readyState >= 2 && video.videoWidth > 0) {
        setState('cameraState', 'KAMERA ✓', true);
        hideStartup();
        return true;
      }
      return false;
    }

    window.addEventListener('load', () => {
      const marker = document.querySelector('#hiroMarker');
      const hint = document.querySelector('.hint');
      const scene = document.querySelector('a-scene');

      marker.addEventListener('markerFound', () => {
        setState('markerState', 'MARKER ✓', true);
        hint.textContent = 'Model je ukotvený nad markerom. Pohybuj mobilom okolo.';
      });

      marker.addEventListener('markerLost', () => {
        setState('markerState', 'HĽADÁM MARKER');
        hint.textContent = 'Namier kameru na celý HIRO marker.';
      });

      scene.addEventListener('loaded', () => {
        setState('arState', 'AR.JS ✓', true);
      });

      // AR.js vytvára video element dynamicky. Kontrolujeme ho krátko po štarte.
      let tries = 0;
      const timer = setInterval(() => {
        tries++;
        if (checkCameraVideo()) {
          clearInterval(timer);
        } else if (tries >= 40) {
          clearInterval(timer);
          setState('cameraState', 'KAMERA ?', false, true);
          document.getElementById('startupText').textContent =
            'Kamera sa nespustila. Skontroluj povolenie kamery v Chrome a obnov stránku.';
          document.getElementById('startupHelp').textContent =
            'Chrome → ikona nastavení pri adrese → Povolenia → Kamera → Povoliť.';
        }
      }, 250);

      // Bezpečnostná poistka: ak kamera existuje, overlay nesmie zostať visieť.
      setTimeout(() => {
        if (document.querySelector('video')) hideStartup();
      }, 2500);

      let heightMm = 50;
      let scalePct = 100;

      const floatRoot = document.getElementById('floatRoot');
      const modelScale = document.getElementById('modelScale');
      const heightReadout = document.getElementById('heightReadout');
      const scaleReadout = document.getElementById('scaleReadout');

      function applyCalibration(){
        floatRoot.setAttribute('position', `0 ${heightMm / 100} 0`);

        const s = 0.01 * (scalePct / 100);
        modelScale.setAttribute('scale', `${s} ${s} ${s}`);

        heightReadout.textContent = `${heightMm} mm nad markerom`;
        scaleReadout.textContent = `${scalePct} %`;
      }

      document.getElementById('downBtn').addEventListener('click', () => {
        heightMm = Math.max(0, heightMm - 10);
        applyCalibration();
      });

      document.getElementById('upBtn').addEventListener('click', () => {
        heightMm = Math.min(300, heightMm + 10);
        applyCalibration();
      });

      document.getElementById('scaleDownBtn').addEventListener('click', () => {
        scalePct = Math.max(50, scalePct - 5);
        applyCalibration();
      });

      document.getElementById('scaleUpBtn').addEventListener('click', () => {
        scalePct = Math.min(150, scalePct + 5);
        applyCalibration();
      });

      applyCalibration();
    });
  </script>
</head>

<body>
  <div id="startup">
    <div id="startupText" style="font-size:22px;font-weight:850">Spúšťam kameru a AR…</div>
    <small id="startupHelp">Po povolení kamery by sa mal do pár sekúnd zobraziť obraz zo zadnej kamery.</small>
  </div>

  <div class="hud">
    <div class="panel">
      <div class="title">CA_0017_X_A_DT · Marker AR v0.8</div>
      <div class="sub">100 mm HIRO marker · živá kamera · CAD približne 1:1</div>
      <div class="states">
        <span id="arState" class="state">AR.JS…</span>
        <span id="cameraState" class="state">KAMERA…</span>
        <span id="modelState" class="state">MODEL…</span>
        <span id="markerState" class="state">HĽADÁM MARKER</span>
      </div>
    </div>

    <a class="back" href="./">3D VIEWER</a>
  </div>

  <div class="adjust">
    <button type="button" id="downBtn">VÝŠKA −</button>
    <div class="readout" id="heightReadout">50 mm nad markerom</div>
    <button type="button" id="upBtn">VÝŠKA +</button>
    <button type="button" id="scaleDownBtn">MIERKA −</button>
    <div class="readout" id="scaleReadout">100 %</div>
    <button type="button" id="scaleUpBtn">MIERKA +</button>
  </div>

  <div class="hint">Namier kameru na celý HIRO marker.</div>

  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="antialias:true; alpha:true; colorManagement:true;"
    arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono;"
  >
    <a-assets timeout="30000">
      <a-asset-item id="cadAsset" src="./CA_0017_X_A_DT.glb"></a-asset-item>
    </a-assets>

    <a-marker
      id="hiroMarker"
      preset="hiro"
      smooth="true"
      smoothCount="7"
      smoothTolerance="0.01"
      smoothThreshold="3"
    >
      <!--
        AR.js marker width = 1 jednotka.
        Pri fyzickom markeri 100 mm: 100 mm CAD * 0.01 = 1 marker unit.
      -->
      <a-entity id="floatRoot" position="0 0.50 0">
        <a-entity id="modelScale" rotation="-90 0 0" scale="0.01 0.01 0.01">
          <a-entity gltf-model="#cadAsset" cnc-cad-style></a-entity>
        </a-entity>
      </a-entity>

      <a-entity light="type:ambient; intensity:1.8; color:#ffffff"></a-entity>
      <a-entity light="type:directional; intensity:1.4; color:#ffffff" position="2 4 3"></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
